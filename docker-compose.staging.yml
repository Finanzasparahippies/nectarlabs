name: nectarlabs-staging

services:
  backend-staging:
    image: nectar-labs-backend:staging
    container_name: nectar_backend_staging
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app:Z
      - ./backend/logs:/app/logs:Z
      - ${DOCKER_SOCK:-./docker/dummy_sock}:/var/run/docker.sock:z
    env_file:
      - .env.staging
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DEBUG=True
      - REALTIME_INTERNAL_URL=http://realtime:4001
      - REALTIME_INTERNAL_SECRET=nectar-internal-secret

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - prod_network

  frontend-staging:
    image: nectar-labs-frontend:staging
    container_name: nectar_frontend_staging
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://staging.nectarlabs.dev/api
    command: sh -c "npm run build && npm run start"
    volumes:
      - ./frontend:/app:Z
      - /app/node_modules
      - /app/.next
    env_file:
      - .env.staging
    environment:
      - NEXT_PUBLIC_API_URL=https://staging.nectarlabs.dev/api
      - API_URL=http://backend-staging:8000/api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - prod_network

  redis:
    container_name: nectar_redis_staging
    image: docker.io/library/redis:alpine
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - prod_network

  realtime:
    container_name: nectar_realtime_staging
    image: nectar-labs-realtime:staging
    build:
      context: ./realtime
      dockerfile: Dockerfile
    command: sh -c "npm run build && npm run start"
    volumes:
      - ./realtime:/app:Z
      - /app/node_modules
    env_file:
      - .env.staging
    environment:
      - PORT=4000
      - INTERNAL_PORT=4001
      - INTERNAL_SECRET=nectar-internal-secret
      - DJANGO_SECRET_KEY=${SECRET_KEY:-}
    depends_on:
      - redis
    networks:
      - prod_network

  premium_ties_backend_staging:
    container_name: premium_ties_backend_staging
    image: premium-ties-backend:staging
    build:
      context: /var/www/premium-ties/backend
      dockerfile: Dockerfile
    volumes:
      - /var/www/premium-ties/backend:/app:z
      - premium_ties_db_staging_data:/var/lib/postgresql/data
    env_file:
      - /var/www/premium-ties/.env.staging
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - prod_network

  premium_ties_frontend_staging:
    container_name: premium_ties_frontend_staging
    image: premium-ties-frontend:staging
    build:
      context: /var/www/premium-ties/frontend
      dockerfile: Dockerfile
    env_file:
      - /var/www/premium-ties/.env.staging
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - prod_network

volumes:
  premium_ties_db_staging_data:

networks:
  prod_network:
    external: true

