# --- 2. NECTAR LABS PRODUCCIÓN ---
server {
    listen 80;
    server_name nectarlabs.dev www.nectarlabs.dev *.nectarlabs.dev;

    set $nectar_be http://nectar_backend:8000;
    set $nectar_fe http://nectar_frontend:3000;
    set $nectar_rt http://nectar_realtime_prod:4000;

    location ~* ^/(wp-admin|wp-includes|wp-content|xmlrpc\.php|wp-login\.php|\.env|\.git|autodiscover|phpmyadmin) { return 444; }
    location ~* \.(php|asp|aspx|jsp|cgi)$ { return 444; }

    location ~ ^/(api|admin|static|media) {
        proxy_pass $nectar_be;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /ws/ {
        proxy_pass $nectar_rt;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;
    }

    location / {
        proxy_pass $nectar_fe;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}

