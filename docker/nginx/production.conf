# --- 4. NECTAR LABS STAGING ---
server {
    listen 80;
    server_name staging.nectarlabs.dev www.staging.nectarlabs.dev *.staging.nectarlabs.dev *-staging.nectarlabs.dev staging.* *.staging.*;

    set $nectar_be_staging http://nectar_backend_staging:8000;
    set $nectar_fe_staging http://nectar_frontend_staging:3000;
    set $nectar_rt_staging http://nectar_realtime_staging:4000;

    location ~* ^/(wp-admin|wp-includes|wp-content|xmlrpc\.php|wp-login\.php|\.env|\.git|autodiscover|phpmyadmin) { return 444; }
    location ~* \.(php|asp|aspx|jsp|cgi)$ { return 444; }

    location ~ ^/(api|admin|static|media) {
        proxy_pass $nectar_be_staging;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /_next/static/ {
        proxy_pass $nectar_fe_staging;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /ws/ {
        proxy_pass $nectar_rt_staging;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;
    }

    location / {
        proxy_pass $nectar_fe_staging;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}

# --- 5. AMBIENTES CASO PRODUCCIÓN ---
server {
    listen 80;
    server_name ambientes.nectarlabs.dev;
    client_max_body_size 25M;

    set $ambientes_be http://ambientes_backend_prod:8000;
    set $ambientes_fe http://ambientes_frontend_prod:80;

    location ~* ^/(wp-admin|wp-includes|wp-content|xmlrpc\.php|wp-login\.php|\.env|\.git|autodiscover|phpmyadmin) { return 444; }
    location ~* \.(php|asp|aspx|jsp|cgi)$ { return 444; }

    location ~ ^/(api|admin) {
        proxy_pass $ambientes_be;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass $ambientes_fe;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}

