# --- 7. TIENDA DE LIGAS (KŌRES / PREMIUM TIES) - PRODUCCIÓN ---
server {
    listen 80;
    server_name prod.kores.vip www.prod.kores.vip legacy-prod.kores.internal;
    client_max_body_size 25M;

    # Evaluación perezosa mediante variables para prevenir fallos fatales de DNS en el arranque
    set $premium_ties_be_prod http://nectar_backend:8000;
    set $premium_ties_fe_prod http://nectar_frontend:3000;

    location ~* ^/(wp-admin|wp-includes|wp-content|xmlrpc\.php|wp-login\.php|\.env|\.git|autodiscover|phpmyadmin) { return 444; }
    location ~* \.(php|asp|aspx|jsp|cgi)$ { return 444; }

    # Ruta API / Admin / Static de Django Backend
    location ~ ^/(api|admin|static) {
        proxy_pass $premium_ties_be_prod;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Frontend de la Tienda (Next.js centralizado)
    location / {
        proxy_pass $premium_ties_fe_prod;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}

# --- 8. TIENDA DE LIGAS (KŌRES / PREMIUM TIES) - STAGING ---
server {
