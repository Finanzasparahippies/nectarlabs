# ==============================================================================
# Nectar Labs Enterprise - Multi-Tenant Nginx Reverse Proxy (Production & Staging)
# File: nectarlabs-main/docker/nginx/production.conf
# ==============================================================================

# DNS del resolver interno de Docker con IPv6 desactivado y TTL optimizado a 10s
resolver 127.0.0.11 valid=10s ipv6=off;

# Cabeceras comunes para WebSocket proxying
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# --- RESOLUCIÓN DINÁMICA VÍA DOCKER DNS RESOLVER ---
# Los upstream estáticos fallan en el arranque (emerg) si un contenedor está detenido.
# La evaluación perezosa (lazy evaluation) mediante variables y resolver 127.0.0.11
# garantiza la resiliencia del proxy inverso central (prod_nginx).


# --- DEFAULT SERVER: CERRAR CONEXIÓN PARA DIRECCIONES IP NO REGISTRADAS Y BOTS (HTTP 444) ---
server {
    listen 80 default_server;
    server_name _;

    # Retorna HTTP 444 (cierra la conexión inmediatamente sin enviar respuesta)
    return 444;
}

# --- 1. FINANZAS PARA HIPPIES ---
server {
    listen 80;
    server_name finanzasparahippies.com www.finanzasparahippies.com finanzasparahippies.nectarlabs.dev www.finanzasparahippies.nectarlabs.dev;

    set $fph_be http://fph_backend:8000;
    set $fph_fe http://fph_frontend:3000;

    # Bloqueo inmediato de escáneres y exploits PHP/WP
    location ~* ^/(wp-admin|wp-includes|wp-content|xmlrpc\.php|wp-login\.php|\.env|\.git|autodiscover|phpmyadmin) { return 444; }
    location ~* \.(php|asp|aspx|jsp|cgi)$ { return 444; }

    location ~ ^/(api|admin|static|media) {
        proxy_pass $fph_be;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass $fph_fe;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}

# --- 2. NECTAR LABS PRODUCCIÓN ---
server {
    listen 80;
    server_name nectarlabs.dev www.nectarlabs.dev *.nectarlabs.dev;

    set $nectar_be http://nectar_backend:8000;
    set $nectar_fe http://nectar_frontend:3000;
    set $nectar_rt http://nectar_realtime_prod:4000;

    location ~* ^/(wp-admin|wp-includes|wp-content|xmlrpc\.php|wp-login\.php|\.env|\.git|autodiscover|phpmyadmin) { return 444; }
    location ~* \.(php|asp|aspx|jsp|cgi)$ { return 444; }

    location ~ ^/(api|admin|static|media) {
        proxy_pass $nectar_be;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /ws/ {
        proxy_pass $nectar_rt;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;
    }

    location / {
        proxy_pass $nectar_fe;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}

